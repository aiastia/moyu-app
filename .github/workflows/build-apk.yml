name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一分支/标签的新构建自动取消旧构建（省排队时间）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Prebuild android project
        run: npx expo prebuild -p android --no-install

      - name: Apply release signing
        run: node scripts/apply-signing.js

      - name: Tune gradle memory
        run: |
          if grep -q '^org.gradle.jvmargs=' android/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g' >> android/gradle.properties
          fi
          cat android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            if [ "$base" = "app-release" ]; then
              cp "$f" "dist/moyu-writer-v${VERSION}.apk"
            else
              abi=${base#app-}
              abi=${abi%-release}
              cp "$f" "dist/moyu-writer-v${VERSION}-${abi}.apk"
            fi
          done
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moyu-writer-apk
          path: dist/*.apk

      - name: Create release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
