name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一分支/标签的新构建自动取消旧构建（省排队时间）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main 日常推送只做类型检查；全量 APK 构建只在打 tag / 手动触发时跑。
  # 此前 main 和 tag 各编一次完整 APK（双倍时间），且两次并发构建会互相挤占
  # gradle/NDK 缓存写入，日常 push 从 ~10 分钟降到 ~2 分钟。
  ci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # ===== 缓存策略（2026-08-25 重构）：只存 main scope 一份，tag 只读不写 =====
      # actions/cache 按 ref 隔离：tag 之间互相读不到（新 tag 曾各自重存全套
      # gradle+ndk+node_modules≈4.7GB，两版并存挤爆 10GB 配额），但所有构建
      # 都能读默认分支(main) scope 的缓存（ci job 存的 node-cache 在 tag 构建
      # 命中过，实证）。因此：restore 一律执行（tag 发版也暖编），save 只在
      # workflow_dispatch(从 main 触发)时执行——全仓库永远只有一份缓存代际。
      # 发版前（或依赖升级后）跑一次手动构建即可刷新缓存。

      - name: Restore node_modules
        id: nmod
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nmod.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Type check
        run: npx tsc --noEmit

      - name: Prebuild android project
        run: npx expo prebuild -p android --no-install

      # 缓存代际清理（仅手动构建时）：删旧 key 的垃圾代际 + 历史遗留的 tag scope
      # 副本（tag 改为只读后不会再产生），保留 main scope 当前 key 的那一份。
      # 必须在 prebuild 之后（gradle key 依赖 android/gradle/wrapper 文件）。
      - name: Prune stale cache generations
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cur_node="node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}"
          cur_ndk="ndk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}"
          cur_gradle="gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}"
          gh cache list --repo "$GITHUB_REPOSITORY" --json id,key,ref --limit 100 \
            | jq -r '.[] | [.id, .key, .ref] | @tsv' \
            | while IFS=$'\t' read -r id key ref; do
                case "$key" in
                  node-modules-*) cur="$cur_node" ;;
                  ndk-*) cur="$cur_ndk" ;;
                  gradle-*) cur="$cur_gradle" ;;
                  *) continue ;;
                esac
                if [ "$key" != "$cur" ] || [[ "$ref" == *refs/tags/* ]]; then
                  echo "delete: $key ($ref)"
                  gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
                fi
              done

      # NDK 缓存：gradle 首次构建会下载约 1GB 的 NDK 并解压（3-5 分钟），
      # 不在 ~/.gradle 里、每次都重新来。key 绑 package-lock：expo/RN 升级
      # → ndkVersion 变 → 新 key，不会错配。
      - name: NDK cache
        uses: actions/cache/restore@v6
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Gradle 缓存：必须在 prebuild 之后（此时 android/ 已生成才能算缓存key）。
      # key 不含 github.sha——原设计精确 key 永远 miss、每 run 再保存 2-4GB，
      # 10GB 配额下旧缓存被挤掉、命中率不稳。改为内容 key 精确命中；
      # ~/.gradle/caches 内含 build-cache-1，配合 org.gradle.caching=true 可
      # 跨构建复用 Kotlin/Hermes 等任务编译结果（省 2-4 分钟）。
      - name: Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            gradle-${{ runner.os }}-

      - name: Apply release signing
        run: node scripts/apply-signing.js
        env:
          MOYU_KEYSTORE_BASE64: ${{ secrets.MOYU_KEYSTORE_BASE64 }}
          MOYU_KEYSTORE_PASSWORD: ${{ secrets.MOYU_KEYSTORE_PASSWORD }}
          MOYU_KEYSTORE_ALIAS: ${{ secrets.MOYU_KEYSTORE_ALIAS }}

      - name: Tune gradle
        run: |
          set_prop() {
            if grep -q "^$1=" android/gradle.properties; then
              sed -i "s/^$1=.*/$1=$2/" android/gradle.properties
            else
              echo "$1=$2" >> android/gradle.properties
            fi
          }
          set_prop org.gradle.jvmargs "-Xmx6g -XX:MaxMetaspaceSize=1g"
          set_prop org.gradle.caching true
          set_prop org.gradle.parallel true
          # 只编 arm64-v8a：砍掉 armeabi-v7a 32 位架构（2017 年前老机用），
          # 原生库（Hermes/libreactnative/expo 模块）编译量减半、包体积更小
          set_prop reactNativeArchitectures arm64-v8a
          cat android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      # 缓存回写：只在手动构建（main scope）时保存——tag 构建写了也只存在
      # 自己 tag 名下（别的构建读不到），纯占配额。key 与上面三个 restore
      # 严格一致，未变化时 save 自动跳过。
      - name: Save node_modules cache
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Save NDK cache
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Save gradle cache
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            if [ "$base" = "app-release" ]; then
              cp "$f" "dist/moyu-writer-v${VERSION}.apk"
            else
              abi=${base#app-}
              abi=${abi%-release}
              cp "$f" "dist/moyu-writer-v${VERSION}-${abi}.apk"
            fi
          done
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: moyu-writer-apk
          path: dist/*.apk

      - name: Create release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
